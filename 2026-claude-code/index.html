# Slash commands

Built-in shortcuts for common tasks:

* `/status` - This one's clear
* `/context` - How is LLM context occupied for this session?
* `/cost` - How much did the current session cost and which models were used?
* `/plan` - Enable planning mode or show the plan
* `/rewind` - Go back to a previous checkpoint

Try: Type `/` to see available commands
